  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 7;
      var CUT_2 = 2.70;   // the blocked line's hard cut
      var HOLD = 3.40;    // the held frame begins

      var root = document.querySelector('[data-composition-id="01-it-stopped-itself"]');
      var q = function (sel) { return root.querySelector(sel); };

      var stub    = q(".f01-isitself-stub");
      var w1      = q(".f01-isitself-w1");
      var w2      = q(".f01-isitself-w2");
      var w3      = q(".f01-isitself-w3");
      var t1Text  = q(".f01-isitself-t1-text");
      var caret   = q(".f01-isitself-caret");
      var t2clip  = q(".f01-isitself-t2clip");
      var punch   = q(".f01-isitself-punch");
      var jitter  = q(".f01-isitself-jitter");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-it-stopped-itself"] = tl;

      /* ------------------------------------------------------------------
       * SCENE 2 — kinetic beat-slam. The blueprint's signature move: three
       * words, three landings, one cadence. Each word slams down from above
       * with a short blur-off; the last lands with a small spring settle.
       * fromTo everywhere, so a seek to t=0 lands the resting state.
       * ---------------------------------------------------------------- */
      tl.fromTo(stub,
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.34, ease: "power2.out" },
        0.20);

      var slam = { y: 36, scale: 1.05, filter: "blur(5px)" };
      var land = { y: 0, scale: 1, filter: "blur(0px)" };

      tl.fromTo(w1,
        { opacity: 0, y: slam.y, scale: slam.scale, filter: slam.filter },
        { opacity: 1, y: land.y, scale: land.scale, filter: land.filter, duration: 0.18, ease: "power4.out" },
        0.20);
      tl.fromTo(w2,
        { opacity: 0, y: slam.y, scale: slam.scale, filter: slam.filter },
        { opacity: 1, y: land.y, scale: land.scale, filter: land.filter, duration: 0.18, ease: "power4.out" },
        0.50);
      tl.fromTo(w3,
        { opacity: 0, y: slam.y, scale: slam.scale, filter: slam.filter },
        { opacity: 1, y: land.y, scale: land.scale, filter: land.filter, duration: 0.30, ease: "back.out(1.7)" },
        0.86);

      /* ------------------------------------------------------------------
       * discrete-text-sequence — the type-on. A sparse array of absolute-time
       * {t, s} states; a reverse search on every update. Schedule shape does
       * the work: tight keystroke clusters, a held breath at each word break.
       * Jumps are INSTANT (no tween on the string itself).
       * The same driver carries the hard cut of the blocked line: one whole-
       * state swap, no fade, no slide.
       * ---------------------------------------------------------------- */
      var SEQ = [
        { t: 0.00, s: "" },
        { t: 1.49, s: "→" },
        { t: 1.54, s: "→ b" },
        { t: 1.59, s: "→ bl" },
        { t: 1.64, s: "→ blast-r" },
        { t: 1.69, s: "→ blast-radius" },
        /* breath at the word break */
        { t: 1.83, s: "→ blast-radius  s" },
        { t: 1.88, s: "→ blast-radius  src/" },
        { t: 1.93, s: "→ blast-radius  src/bi" },
        { t: 1.98, s: "→ blast-radius  src/bil" },
        { t: 2.03, s: "→ blast-radius  src/billi" },
        { t: 2.08, s: "→ blast-radius  src/billin" },
        { t: 2.13, s: "→ blast-radius  src/billing" },
        /* breath at the second break */
        { t: 2.27, s: "→ blast-radius  src/billing/r" },
        { t: 2.32, s: "→ blast-radius  src/billing/re" },
        { t: 2.37, s: "→ blast-radius  src/billing/ret" },
        { t: 2.42, s: "→ blast-radius  src/billing/retry" },
        { t: 2.47, s: "→ blast-radius  src/billing/retry." },
        { t: 2.52, s: "→ blast-radius  src/billing/retry.j" },
        { t: 2.57, s: "→ blast-radius  src/billing/retry.js" }
      ];

      function stateAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) {
          if (time >= SEQ[i].t) return SEQ[i].s;
        }
        return "";
      }

      var driver = { t: 0 };
      tl.to(driver, {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          t1Text.textContent = stateAt(driver.t);
          t2clip.style.opacity = driver.t >= CUT_2 ? "1" : "0";
        }
      }, 0);

      /* Caret: deterministic sin square wave on the timeline, never CSS.
       * Hidden until the type-on starts, blinking through the receipt,
       * then stopped and held for the rest of the frame. */
      tl.set(caret, { opacity: 0 }, 1.40);
      var blink = { p: 0 };
      tl.to(blink, {
        p: Math.PI * 2 * 3,
        duration: 1.90,
        ease: "none",
        onUpdate: function () {
          caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
        }
      }, 1.45);
      tl.set(caret, { opacity: 1 }, HOLD);

      /* ------------------------------------------------------------------
       * SCENE 3 — the blocked line lands hard: an instant swap plus one small
       * settle. Kept on its own element so the hold's transform below never
       * collides with this entrance.
       * ---------------------------------------------------------------- */
      tl.fromTo(punch,
        { scale: 1.035, transformOrigin: "left center" },
        { scale: 1, duration: 0.26, ease: "power3.out" },
        CUT_2);

      /* ------------------------------------------------------------------
       * SCENE 4 — held frame. The caret has stopped; the only life left is the
       * sanctioned low end of sine-wave-loop: 1.3px of jitter on the blocked
       * line, one finite tween across the whole hold, amplitude ramped to zero
       * over the last 15% so the frame ends genuinely still.
       * ---------------------------------------------------------------- */
      var IDLE_START = 3.50;
      var IDLE_DUR = DUR - IDLE_START;
      var CYCLES = IDLE_DUR / 3.0;          // ~3s period
      var Y_AMP = 1.3;                      // px — low end of the range
      var FADE_FRAC = 0.15;
      var phase = { p: 0 };

      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function () {
          var t = phase.p / (Math.PI * 2 * CYCLES);
          var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
          var s = Math.sin(phase.p);
          jitter.style.transform = "translateY(" + (s * Y_AMP * env).toFixed(3) + "px)";
        }
      }, IDLE_START);
    })();
  </script>
