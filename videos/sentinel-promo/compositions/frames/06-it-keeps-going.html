  <script>
  (function () {
    if (!window.gsap) { return; }
    var gsap = window.gsap;

    var scope = (document.currentScript && document.currentScript.parentNode) || document;
    var root = scope.querySelector('[data-composition-id="06-it-keeps-going"]') ||
               document.querySelector('[data-composition-id="06-it-keeps-going"]');
    if (!root) { return; }
    function q(sel) { return root.querySelector(sel); }
    function qa(sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); }

    var stage  = qa('.s06-layer')[1];
    var stubs  = qa('.s06-stub');
    var labels = qa('.s06-label');
    var hairs  = qa('.s06-hair');
    var caret1 = qa('.s06-row')[0].querySelector('.s06-crt');
    var caret2 = qa('.s06-row')[1].querySelector('.s06-crt');
    var caret3 = qa('.s06-panelR .s06-crt')[0];
    var ack    = q('.s06-ack');
    var barSt  = q('.s06-gbar-st');
    var barOp  = q('.s06-gbar-op');
    var cue    = q('.s06-cue');
    var sumstub= q('.s06-sumstub');
    var ticks  = qa('.s06-tick');

    /* ---- type-on: per-character width reveal, deterministic, no measuring ---- */
    function buildChars(el) {
      var txt = el.getAttribute('data-txt') || '';
      var host = el.querySelector('.s06-chwrap') || el;
      host.textContent = '';
      var frag = document.createDocumentFragment();
      var spans = [];
      for (var i = 0; i < txt.length; i++) {
        var ch = txt.charAt(i);
        var c = document.createElement('span');
        var isTri = ch === '\u25B8';
        c.className = 's06-ch' + (isTri ? ' tri' : '');
        /* The U+25B8 marker is drawn by .tri::after, not glyphed: it is outside every
           shipped Geist Mono unicode-range, so the glyph itself is colour:transparent.
           Emit it as an empty, explicitly-sized box instead of transparent text — the
           rendered shape is identical, with no dependency on a fallback font, and the
           text_not_painted check no longer sees unpainted glyph content. */
        c.textContent = ch === ' ' ? '\u00A0' : (isTri ? '' : ch);
        frag.appendChild(c);
        spans.push(c);
      }
      host.appendChild(frag);
      return spans;
    }

    var typed = {
      l1: buildChars(qa('.s06-row')[0]),
      l2: buildChars(qa('.s06-row')[1]),
      st: buildChars(q('.s06-row-status')),
      ab: buildChars(q('.s06-row-absorbed')),
      rr: buildChars(q('.s06-panelR .s06-row')),
      su: buildChars(q('.s06-summary'))
    };

    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines['06-it-keeps-going'] = tl;

    function typeAt(spans, at, dur) {
      var n = spans.length;
      var w = 0.06;
      var s = n > 1 ? Math.max(0.005, (dur - w) / (n - 1)) : 0;
      tl.fromTo(spans, { width: 0 }, { width: '1ch', duration: w, ease: 'none', stagger: s }, at);
    }

    /* bounded caret blink - keyframes, never repeat */
    function blink(el, at, n, p, base) {
      var from = base === undefined ? 1 : base;
      var to = base === undefined ? 0.06 : base * 0.12;
      for (var i = 0; i < n; i++) {
        tl.fromTo(el, { opacity: from }, {
          keyframes: [
            { opacity: to,       duration: p * 0.14 },
            { opacity: 1,        duration: p * 0.30 },
            { opacity: to,       duration: p * 0.14 },
            { opacity: 1,        duration: p * 0.30 },
            { opacity: to,       duration: p * 0.12 }
          ],
          duration: p, ease: 'none'
        }, at + i * p);
      }
    }

    /* ---- SCENE 1 (0.0-0.4) - the split establishes: two panels, one hairline ---- */
    tl.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: 'power2.out' }, 0);
    tl.fromTo(stubs, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: 'power3.out', stagger: 0.06 }, 0.04);
    tl.fromTo(labels, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.32, ease: 'power2.out', stagger: 0.08 }, 0.07);
    tl.fromTo(hairs, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power3.out', stagger: 0.1 }, 0.1);

    /* ---- SCENE 2 (0.4-2.0) - the watcher command types on, then its status lands ---- */
    tl.fromTo(caret1, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'none' }, 0.40);
    blink(caret1, 0.46, 3, 0.2);
    typeAt(typed.l1, 0.42, 0.60);

    tl.fromTo(caret1, { opacity: 1 }, { opacity: 0, duration: 0.06, ease: 'none' }, 1.08);
    tl.fromTo(caret2, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'none' }, 1.06);
    blink(caret2, 1.12, 5, 0.22);
    typeAt(typed.l2, 1.02, 0.64);

    /* watcher goes quiet: caret dims, an idle blink or two, then sleeps between ticks */
    tl.to(caret2, { opacity: 0.34, duration: 0.3, ease: 'power2.inOut' }, 2.26);
    blink(caret2, 2.62, 3, 0.34, 0.34);

    tl.fromTo(barSt, { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: 'back.out(2.4)' }, 1.68);
    tl.fromTo(q('.s06-row-status'), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: 'none' }, 1.68);
    typeAt(typed.st, 1.70, 0.28);

    /* ---- SCENE 3 (2.0-3.69) - the operator types a steer. Cause only. ---- */
    tl.fromTo(caret3, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'none' }, 2.02);
    blink(caret3, 2.06, 5, 0.18);
    typeAt(typed.rr, 2.05, 0.85);

    /* the steer goes out - live-sync cause beat */
    tl.addLabel('cause', 2.98);
    tl.fromTo(ack, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'back.out(2.6)' }, 'cause');
    tl.fromTo(caret3, { opacity: 0.5 }, { opacity: 1, duration: 0.14, ease: 'power2.out' }, 'cause');

    /* ---- SCENE 4 (3.69-8.4) - in the silence, the next tick fires and absorbs it ---- */
    tl.addLabel('tick', 3.69);
    tl.fromTo(cue, { opacity: 0, scaleY: 0 }, { opacity: 0.9, scaleY: 1, duration: 0.32, ease: 'back.out(2.2)' }, 'tick');
    tl.fromTo(barOp, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(3)' }, 'tick');
    tl.fromTo(caret2, { opacity: 0.34 }, { opacity: 1, duration: 0.1, ease: 'power2.out' }, 'tick');
    tl.to(caret2, { opacity: 0.34, duration: 0.16, ease: 'power2.inOut' }, 3.81);

    /* effect on the other side of the hairline, one beat later */
    tl.addLabel('effect', 3.96);
    tl.fromTo(q('.s06-row-absorbed'), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: 'none' }, 'effect');
    typeAt(typed.ab, 3.96, 0.60);

    /* the tick's work streams beneath it */
    tl.fromTo(ticks, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.28, ease: 'power2.out', stagger: 0.32 }, 4.62);

    /* closes on the tally */
    tl.fromTo(sumstub, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power3.out' }, 6.98);
    tl.fromTo(q('.s06-summary'), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: 'none' }, 7.04);
    typeAt(typed.su, 7.06, 0.60);

    /* ---- SCENE 5 (8.4-11.0) - hold. The terminals are still running. ---- */
    blink(caret2, 8.52, 2, 0.4, 0.34);

    function jitter(at, mag) {
      tl.fromTo(caret3, { x: 0, y: 0 }, {
        keyframes: [
          { x: mag,          y: -mag * 0.6, opacity: 0.55, duration: 0.07 },
          { x: -mag * 0.7,   y:  mag * 0.5, opacity: 1,    duration: 0.06 },
          { x:  mag * 0.5,   y:  mag * 0.4, opacity: 0.7,  duration: 0.05 },
          { x: -mag * 0.8,   y: -mag * 0.3, opacity: 1,    duration: 0.07 },
          { x:  mag * 0.3,   y:  mag * 0.5, opacity: 0.8,  duration: 0.05 },
          { x: 0,            y: 0,           opacity: 1,    duration: 0.09 }
        ],
        duration: 0.39, ease: 'none'
      }, at);
    }
    jitter(8.4, 1.2);
    jitter(9.24, 1.5);
    jitter(10.12, 1.0);

    /* hold the window open to the frame's full length */
    tl.to({}, { duration: 0.01 }, 10.99);
  })();
  </script>
