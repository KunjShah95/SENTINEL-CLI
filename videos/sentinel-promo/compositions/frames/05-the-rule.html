  <script>
  (function () {

    var ROW_N    = 6;

    /* content centre of each slot, and the y-offset the bracket / cursor travel by */
    var ROW_C = ROW_TOP.map(function (t) { return t + 32; });
    var ROW_DY = ROW_C.map(function (c) { return c - ROW_C[0]; });   /* 0,96,192,288,384,480 */
    var REST_Y = ROW_DY[ROW_N - 1];

    /* one landing per mode, walked top to bottom, cued on the voice */

    /* the product's real mode definitions -> [file edits, shell]; 1 = on the allowlist.
       Deny copy is the product's own wording ("safe auto-fix, no shell"). */
    var PERM = [
      [1, 1],   /* BUILD  — actually making changes            */
      [0, 0],   /* PLAN   — questions, review, exploration   */
      [0, 0],   /* REVIEW — diff review with a focused prompt */
      [0, 0],   /* SCAN   — security scanning                 */
      [1, 0],   /* FIX    — safe auto-fix, no shell            */
      [1, 1]    /* SWE    — reproduce-first bug fixes         */
    ];

    /* dim-by-position de-emphasis. Exactly three names legible at any instant.
       The floor is deliberately held high so nothing collapses into
       invisible-on-black: names never fall below 0.24, purposes below 0.40. */
    var NAME_FLOOR = 0.24, NAME_PREV = 0.30, NAME_NEXT = 0.58;
    var USE_FLOOR  = 0.40, USE_PREV  = 0.50, USE_NEXT  = 0.62;

    var OK_TXT = ["allowed", "allowed"];
    var NO_TXT = ["no edits", "no shell"];
    var OK_COL = "#8BD99A";
    var NO_COL = "#959C94";

       digit-leading id can never throw a SyntaxError and kill the timeline. */
    function E(id) { return document.getElementById(id); }

    var elAxis     = E("f05-axis");
    var elBandStub = E("f05-band-stub");
    var elBandLbl  = E("f05-band-label");
    var elBandNum  = E("f05-band-num");
    var elCursor   = E("f05-cursor");
    var elBr       = E("f05-br");
    var elBrStub   = E("f05-br-stub");
    var elBrLabel  = E("f05-br-label");
    var elBrLock   = E("f05-br-lock");
    var elBrTop    = E("f05-br-top");
    var elBrBase   = E("f05-br-base");
    var elBrLeft   = E("f05-br-left");
    var elRStub    = E("f05-r-stub");
    var elRKicker  = E("f05-r-kicker");
    var elRHair1   = E("f05-r-hair1");
    var elRHair2   = E("f05-r-hair2");
    var elRWord    = E("f05-r-word");
    var elRFoot    = E("f05-r-foot");

    var rows = [], names = [], uses = [];
    for (var i = 0; i < ROW_N; i++) {
      rows.push(E("f05-m" + i));
      names.push(E("f05-m" + i + "n"));
      uses.push(E("f05-m" + i + "u"));
    }
    var permRow = [E("f05-p0"), E("f05-p1")];
    var permVal = [E("f05-p0v"), E("f05-p1v")];

    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["05-the-rule"] = tl;

    /* ================= Scene 1 (0.00-0.30) : the axis establishes ================= */
    tl.fromTo(elAxis, { scaleY: 0 }, { scaleY: 1, duration: 0.26, ease: "power2.out" }, 0.00);
    tl.fromTo(elBandStub, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, 0.24);
    tl.fromTo(elBandLbl, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power2.out" }, 0.30);
    tl.fromTo(elBandNum, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power2.out" }, 0.34);

    /* ================= Scene 2 (0.30-1.40) : cluster -> outward expansion =========

       offset from the shared centre out to zero, so x/y are pure offsets and the
       slot is never fought. With six items a full cluster piles up, so the start is

    var BURST_ORDER = [2, 3, 1, 4, 0, 5];

    var STAGGER     = 0.055;
    var START_PROG  = 0.32;

      var bi = BURST_ORDER[b];
      var startY = (ROW_C[bi] - STAGE_C) * START_PROG;

        { x: -18, y: startY, scale: 0.90, opacity: 0 },
        { x: 0, y: 0, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
        0.30 + b * STAGGER);

    /* the opacity ladder and the allowlist contents are pure functions of timeline

       every seek (forward or backward) repaints the same state. discrete-text-sequence
       for the value swap; no CSS transition, no mutable tracker. */
    var driver = { t: 0 };

    function activeAt(t) {
      var k = -1;
      for (var i = 0; i < ROW_N; i++) { if (t >= LAND[i]) k = i; }
      return k;
    }
    function rung(k, i, floor, prev, next) {
      if (k < 0) return floor;
      if (i === k) return 1.0;
      if (i === k + 1) return next;
      if (i === k - 1) return prev;
      return floor;
    }
    function renderAt(t) {
      var k = activeAt(t);
      for (var i = 0; i < ROW_N; i++) {
        if (names[i]) names[i].style.opacity = String(rung(k, i, NAME_FLOOR, NAME_PREV, NAME_NEXT));
        if (uses[i])  uses[i].style.opacity  = String(rung(k, i, USE_FLOOR,  USE_PREV,  USE_NEXT));
      }
      var m = (k < 0) ? PERM[0] : PERM[k];

        if (!permVal[p]) continue;
        var on = m[p] === 1;
        permVal[p].textContent = on ? OK_TXT[p] : NO_TXT[p];
        permVal[p].style.color  = on ? OK_COL : NO_COL;
      }
    }
    renderAt(0);

    /* ================= the step-through: cursor + bracket re-anchor ==============
       the opacity ladder and the allowlist contents are driven by `driver` above;
       here only the two moving anchors are re-seated, one landing each. */
    for (var k = 0; k < ROW_N; k++) {
      var at = LAND[k];

      /* the lit cursor slots into the active row */
      tl.fromTo(elCursor,
        { y: ROW_DY[k === 0 ? 0 : k - 1] },
        { y: ROW_DY[k], duration: 0.18, ease: "power3.out" }, at);
      if (k > 0) {
        tl.fromTo(elCursor, { scaleX: 1.55 }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, at);
      } else {
        tl.to(elCursor, { scaleX: 1, duration: 0.20, ease: "power2.out" }, at);
      }

      /* the bracket re-anchors beside the active mode */
      if (k > 0) {
        tl.fromTo(elBr, { y: ROW_DY[k - 1] },
          { y: ROW_DY[k], duration: 0.18, ease: "power3.out" }, at);
      }
    }

    /* the one always-on driver: opacity ladder + allowlist contents, both pure
       functions of timeline time. Never repeats, never yoyos. */
    tl.to(driver,
      { t: DURATION, duration: DURATION, ease: "none",
        onUpdate: function () { renderAt(driver.t); } },
      0);

    /* ================= Scene 3 (1.40-3.20) : the bracket draws itself on ==========
       svg-path-draw. Dasharray/dashoffset come from the measured getTotalLength(),
       never guessed, and each segment starts at ~75% of the previous one's duration
       so the four segments read as one trace. */
    var brPaths = [elBrLeft, elBrTop, elBrBase];
    if (elBrLeft && elBrTop && elBrBase) {
      for (var d = 0; d < brPaths.length; d++) {
        var len = 0;
        try { len = brPaths[d].getTotalLength(); } catch (err) { len = 0; }
        if (!len || !isFinite(len)) len = 300;
        len *= 1.05;                       /* slight overestimate: never clips the end */
        brPaths[d].style.strokeDasharray = String(len);
        brPaths[d].style.strokeDashoffset = String(len);
      }
    }

    tl.fromTo(elBrStub, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power2.out" }, 1.40);
    tl.to(brPaths[0], { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, 1.40);
    tl.to(brPaths[1], { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 1.67);
    tl.to(brPaths[2], { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 1.90);
    tl.fromTo(elBrLabel, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out" }, 1.72);

    /* its permission rows step in one per landing */
    tl.fromTo(permRow[0], { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.20, ease: "power3.out" }, 1.72);
    tl.fromTo(permRow[1], { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.20, ease: "power3.out" }, 1.86);

    /* ================= Scene 4 (3.20-4.82) : the bracket LOCKS =====================
       a hard latch, not a bounce: the closing bracket snaps shut in 0.10s. */
    if (elBrLock) {
      var lockLen = 0;
      try { lockLen = elBrLock.getTotalLength(); } catch (err2) { lockLen = 0; }
      if (!lockLen || !isFinite(lockLen)) lockLen = 300;
      lockLen *= 1.05;
      elBrLock.style.strokeDasharray = String(lockLen);
      elBrLock.style.strokeDashoffset = String(lockLen);
      tl.to(elBrLock, { strokeDashoffset: 0, duration: 0.10, ease: "power4.in" }, 3.20);
    }
    tl.fromTo(elBr, { scale: 1.03 }, { scale: 1, duration: 0.24, ease: "power4.out" }, 3.20);

    /* the statement lands on the lock. `cannot` is this frame's only amber. */
    tl.fromTo(elRStub,  { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power2.out" }, 3.16);
    tl.fromTo(elRKicker, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, ease: "power2.out" }, 3.22);
    tl.fromTo(elRHair1,  { scaleX: 0 }, { scaleX: 1, duration: 0.40, ease: "power2.out" }, 3.30);
    tl.fromTo(elRWord,   { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.44, ease: "power3.out" }, 3.40);
    tl.fromTo(elRHair2,  { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.40, ease: "power2.out" }, 3.66);
    tl.fromTo(elRFoot,   { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.30, ease: "power2.out" }, 3.86);

    /* ================= Scene 5 (4.82-8.50) : hold. the rule sits still. ============
       jitter on the locked bracket only: finite, authored ticks that settle back
       to rest. never repeated, never yoyoed. */
    var JITTER = [
      { at: 4.92, dur: 0.12, x:  1.6, y: REST_Y + 0.9 },
      { at: 5.04, dur: 0.10, x: -1.4, y: REST_Y - 0.6 },
      { at: 5.14, dur: 0.09, x:  0.9, y: REST_Y + 0.4 },
      { at: 5.23, dur: 0.08, x: -0.7, y: REST_Y - 0.3 },
      { at: 5.31, dur: 0.12, x:  0.0, y: REST_Y       },
      { at: 6.50, dur: 0.11, x: -1.5, y: REST_Y + 0.7 },
      { at: 6.61, dur: 0.09, x:  1.1, y: REST_Y - 0.5 },
      { at: 6.70, dur: 0.08, x: -0.6, y: REST_Y + 0.3 },
      { at: 6.78, dur: 0.12, x:  0.0, y: REST_Y       }
    ];
    var jx = 0, jy = REST_Y;
    for (var q = 0; q < JITTER.length; q++) {
      tl.fromTo(elBr, { x: jx, y: jy },
        { x: JITTER[q].x, y: JITTER[q].y, duration: JITTER[q].dur, ease: "none" }, JITTER[q].at);
      jx = JITTER[q].x; jy = JITTER[q].y;
    }

    /* hold the timeline open to the full frame length */
    tl.set(elRFoot, { opacity: 1 }, DURATION - 0.04);
  })();
  </script>
</template>
