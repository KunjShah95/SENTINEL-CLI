  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function () {
    "use strict";

    var ID        = "04-the-evidence";
    var DURATION  = 8;

    /* The two lines, verbatim from the product's own transcript. The 13th
       column is shared: "caps" and "revert" line up, exactly as in the terminal. */
    var LINE1     = "retry.js:58  caps retries at 3";
    var LINE2     = "rollback     revert the checkpoint";
    var TOKEN_END = 8;   /* "rollback"                      */
    var PAD_END   = 13;  /* "rollback" + the five spaces   */

    var INK    = "#ECEEE9";
    var GREEN  = "#8BD99A";
    var SAGE   = "#959C94";

    /* --- the shot's cue map -------------------------------------------------
       S1 0.00-0.30  hard cut in, landing mid-motion on both sides
       S2 0.30-2.30  on "shows its work": amber de-emphasises, line 1 types on
       S3 2.30-4.40  on "and the exact command that undoes it": line 2 lands
       S4 4.40-8.00  held payoff. Nothing moves but a sub-pixel jitter.        */
    var L1_T0 = 0.52, L1_T1 = 1.92;
    var L2_T0 = 2.36, L2_T1 = 3.70;
    var UL_T0 = 3.74, UL_T1 = 3.98;
    var CARET_HANDOVER = 2.36;
    var REST_AT = 4.40;
    var JIT_AT  = 4.40;
    var BLINK   = 0.62;  /* caret cycle, seconds */

    function boot() {
      if (typeof gsap === "undefined") return;

      /* Scope every lookup to THIS frame's root: every sub-composition on the
         page authors its root as id="root", so a global id lookup can land on a
         sibling frame's node. Scope by data-composition-id, query by class. */
      var host = null;
      var cur = document.currentScript;
      if (cur && cur.parentNode) {
        host = cur.parentNode.querySelector('[data-composition-id="' + ID + '"]');
      }
      if (!host) {
        var found = document.querySelectorAll('[data-composition-id="' + ID + '"]');
        host = found.length ? found[found.length - 1] : null;
      }
      if (!host) return;
      if (host.getAttribute("data-f04-ready") === "1") return;
      host.setAttribute("data-f04-ready", "1");

      function $(sel) { return host.querySelector(sel); }

      var kicker     = $(".f04-kicker");
      var panel      = $(".f04-panel");
      var block      = $(".f04-block");
      var blockLabel = $(".f04-block-label");
      var blockBody  = $(".f04-block-body");
      var divider    = $(".f04-divider");
      var l1         = $(".f04-l1");
      var l1t        = $(".f04-l1-text");
      var c1         = $(".f04-caret1");
      var l2         = $(".f04-l2");
      var jit        = $(".f04-jitter");
      var tok        = $(".f04-l2-tok");
      var pad        = $(".f04-l2-pad");
      var l2t        = $(".f04-l2-text");
      var ul         = $(".f04-underline");
      var c2         = $(".f04-caret2");

      if (!panel || !l1t || !l2t || !tok || !pad) return;

      window.__timelines = window.__timelines || {};
      var tl = (window.__timelines[ID] = gsap.timeline({ paused: true }));

      /* ---------------------------------------------------------------- *
       * discrete-text-sequence, generalised: the whole block is a PURE
       * function of timeline time, so any seek repaints it correctly.
       * ---------------------------------------------------------------- */
      function charsAt(text, t, t0, t1) {
        if (t <= t0) return 0;
        if (t >= t1) return text.length;
        return Math.floor(((t - t0) / (t1 - t0)) * text.length);
      }
      function blinkOn(t) {
        return Math.sin((t / BLINK) * Math.PI * 2) > 0;
      }

      var CHAR_SEC = (L2_T1 - L2_T0) / LINE2.length;
      var TOK_END_T = L2_T0 + CHAR_SEC * TOKEN_END;

      function render(t) {
        l1t.textContent = LINE1.substring(0, charsAt(LINE1, t, L1_T0, L1_T1));

        var n = charsAt(LINE2, t, L2_T0, L2_T1);
        var s = LINE2.substring(0, n);
        tok.textContent = s.substring(0, Math.min(n, TOKEN_END));
        pad.textContent = s.substring(TOKEN_END, Math.min(n, PAD_END));
        l2t.textContent = s.substring(Math.min(n, PAD_END));

        /* caret 1 lives on line 1 until the hand-over, then hands to line 2 */
        c1.style.opacity = (t > 0.02 && t < CARET_HANDOVER && blinkOn(t)) ? "1" : "0";

        /* context-sensitive cursor: green while it is inside the rollback token */
        c2.style.background = (t < TOK_END_T) ? GREEN : INK;
        c2.style.opacity = (t < REST_AT)
          ? ((t >= L2_T0 && blinkOn(t)) ? "1" : "0")
          : "1";                                  /* Scene 4: rests solid */
      }
      render(0);

      /* the single always-on driver, so every seek repaints the block */
      var driver = { t: 0 };
      tl.to(driver, {
        t: DURATION, duration: DURATION, ease: "none",
        onUpdate: function () { render(driver.t); }
      }, 0);

      /* === SCENE 1 (0.00-0.30) — hard cut in, landing mid-motion on both sides.
             The frame's one genuine dramatic snap: not a fade, a catch. === */
      tl.fromTo(kicker, { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.02);
      tl.fromTo(panel, { y: 24, opacity: 0.93 },
        { y: 0, opacity: 1, duration: 0.30, ease: "power3.out" }, 0);
      tl.fromTo(block, { y: 14 },
        { y: 0, duration: 0.30, ease: "power3.out" }, 0);

      /* === SCENE 2 (0.30-2.30) — on "shows its work": the amber block
             DE-EMPHASISES. A hard state change at one instant, never a crossfade. === */
      tl.set(block, {
        borderLeftColor: SAGE,
        backgroundColor: "rgba(149, 156, 148, 0.05)",
        opacity: 0.8
      }, 0.30);
      tl.set(blockLabel, { color: SAGE }, 0.30);
      tl.set(blockBody, { color: "rgba(149, 156, 148, 0.76)" }, 0.30);

      /* the answer section opens under a hairline, then line 1 types on */
      tl.fromTo(divider, { opacity: 0, scaleX: 0.82 },
        { opacity: 1, scaleX: 1, duration: 0.44, ease: "power3.out" }, 0.34);

      /* === SCENE 3 (2.30-4.40) — on "and the exact command that undoes it":
             the second line lands on its own beat, on its OWN row. === */
      tl.fromTo(l2, { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power3.out" }, L2_T0 - 0.02);

      /* the token is complete — the one green mark that says "this is your way out" */
      tl.fromTo(ul, { scaleX: 0 },
        { scaleX: 1, duration: UL_T1 - UL_T0, ease: "power2.out" }, UL_T0);

      /* === SCENE 4 (4.40-8.00) — the held payoff. Both lines still, nothing
             moves. Sub-pixel jitter on the rollback line only: a deterministic
             harmonic sum over whole cycles, seek-safe, no loop. === */
      var j = { p: 0 };
      tl.to(j, {
        p: Math.PI * 2 * 9,
        duration: DURATION - JIT_AT,
        ease: "none",
        onUpdate: function () {
          var x = Math.sin(j.p) * 1.5 + Math.sin(j.p * 3.07) * 0.45;
          var y = Math.sin(j.p * 2.03) * 0.7 + Math.sin(j.p * 5.11) * 0.22;
          jit.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
        }
      }, JIT_AT);

      /* full-span anchor so the composition duration is exactly the shot's */
      tl.to({}, { duration: DURATION }, 0);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot, { once: true });
    }
    boot();
    window.addEventListener("load", boot);
  })();
  </script>
