  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function () {
    if (typeof gsap === "undefined") return;

    /* Scope every lookup to THIS frame's root. getElementById is unsafe here —
       every sub-composition on the page authors its root as id="root", so a global
       id lookup can land on a sibling frame's node. */
    var host = null;
    var cur = document.currentScript;
    if (cur && cur.parentNode) {
      host = cur.parentNode.querySelector('[data-composition-id="03-one-ask"]');
    }
    if (!host) {
      var found = document.querySelectorAll('[data-composition-id="03-one-ask"]');
      host = found.length ? found[found.length - 1] : null;
    }
    if (!host) return;

    function $(sel) { return host.querySelector(sel); }

    var DURATION = 9;

    window.__timelines = window.__timelines || {};
    var tl = (window.__timelines["03-one-ask"] = gsap.timeline({ paused: true }));

    /* ================= SCENE 1 · 0.00-0.30 · bare ground, terminal chrome ============ */
    tl.fromTo($("#f03-hair-a"), { scaleX: 0 },
      { scaleX: 1, duration: 0.26, ease: "power3.out" }, 0.0);
    tl.fromTo($("#f03-hair-b"), { scaleX: 0 },
      { scaleX: 1, duration: 0.30, ease: "power3.out" }, 0.10);
    tl.fromTo($("#f03-cwd"), { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, 0.12);
    tl.fromTo($("#f03-build"), { opacity: 0, x: 10 },
      { opacity: 1, x: 0, duration: 0.26, ease: "power2.out" }, 0.18);

    /* =============== SCENE 2 · 0.32-1.80 · the ask types on, with a caret ===============
       discrete-text-sequence: a sparse {t,text} table reverse-searched every frame.
       Instant jumps, a 0.23s thinking pause before the final word, no easing on the
       text itself. min-width on the wrap stops the right edge jittering. */
    var T0 = 0.32;
    var TYPE_DUR = 1.28;
    var typedEl = $("#f03-typed");
    var caretEl = $("#f03-caret");

    tl.fromTo($("#f03-cmd"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, T0);

    var SEQUENCE = [
      { t: 0.00, text: "" },
      { t: 0.08, text: "$ s" },
      { t: 0.16, text: "$ sentinel" },
      { t: 0.23, text: "$ sentinel a" },
      { t: 0.31, text: "$ sentinel ask" },
      { t: 0.38, text: "$ sentinel ask " },
      { t: 0.46, text: "$ sentinel ask -b" },
      { t: 0.56, text: "$ sentinel ask -b \"raise" },
      { t: 0.63, text: "$ sentinel ask -b \"raise the" },
      { t: 0.70, text: "$ sentinel ask -b \"raise the retry" },
      { t: 0.80, text: "$ sentinel ask -b \"raise the retry limit" },
      { t: 0.88, text: "$ sentinel ask -b \"raise the retry limit for" },
      { t: 0.95, text: "$ sentinel ask -b \"raise the retry limit for failed" },
      { t: 1.18, text: "$ sentinel ask -b \"raise the retry limit for failed charges" },
      { t: 1.28, text: "$ sentinel ask -b \"raise the retry limit for failed charges\"" }
    ];

    function textAt(time) {
      for (var i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
      }
      return "";
    }

    var typeDriver = { t: 0 };
    var lastTyped = null;
    tl.to(typeDriver, {
      t: TYPE_DUR, duration: TYPE_DUR, ease: "none",
      onUpdate: function () {
        var s = textAt(typeDriver.t);
        if (s !== lastTyped) { typedEl.textContent = s; lastTyped = s; }
      }
    }, T0);

    /* deterministic sin square-wave caret — a pure function of timeline time.
       It dies the instant the line submits. */
    var blink = { p: 0 };
    tl.to(blink, {
      p: Math.PI * 4, duration: TYPE_DUR, ease: "none",
      onUpdate: function () { caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0"; }
    }, T0);
    tl.set(caretEl, { opacity: 0 }, T0 + TYPE_DUR + 0.06);

    /* ====== SCENES 3-4 · 1.80-5.16 · the tool stream lands line by line =================
       dynamic-content-sequencing: one reduction, precomputed ONCE at build. Each entry's
       window comes from its own content length plus a hold, then the sequence is anchored
       to the voiceover beats (1.80 / 2.70) and the block's own 3.60. Nothing is recomputed
       per frame. Everything above holds dead still while these land. */
    var BASE_DURATION = 0.18;   /* s    — minimum per entry */
    var SEC_PER_CHAR  = 0.0030; /* s/ch — terminal cadence */
    var META_DELAY    = 0.14;   /* s    — the count trails its own command */

    var CONTENT = [
      { text: 'grep "MAX_RETRIES" src/',              meta: "2 matches" },
      { text: "readFile src/billing/retry.js:40-72",  meta: "33 lines"  }
    ];

    /* Each entry's own content length sets its enter + meta timing; its start is then
       anchored to the voiceover beat the packet names (1.80 / 2.70). Precomputed
       once here — the per-frame cost is nothing, and nothing is re-derived. */
    var BEATS = [1.80, 2.70];
    var PLAN = [];
    for (var i = 0; i < CONTENT.length; i++) {
      var e = CONTENT[i];
      PLAN.push({
        start: BEATS[i],
        enter: BASE_DURATION + e.text.length * SEC_PER_CHAR,
        metaAt: META_DELAY + e.text.length * 0.0012
      });
    }

    var rowSel = ["#f03-t1", "#f03-t2"];
    var metaSel = ["#f03-meta1", "#f03-meta2"];
    for (var n = 0; n < PLAN.length; n++) {
      var p = PLAN[n];
      tl.fromTo($(rowSel[n]), { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: p.enter, ease: "power3.out" }, p.start);
      tl.fromTo($(metaSel[n]), { opacity: 0, x: 14 },
        { opacity: 1, x: 0, duration: 0.22, ease: "power2.out" }, p.start + p.metaAt);
    }

    /* ============= SCENE 4 · 3.60-5.16 · the block lands alone and hard ================
       Amber only. Every other line is already at its final value and does not move. */
    var BLOCK_AT = 3.60;
    var stub = $("#f03-stub");
    var blockline = $("#f03-blockline");
    var restate = $("#f03-restate");

    tl.fromTo(stub, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "power4.out" }, BLOCK_AT);
    tl.fromTo(blockline, { opacity: 0, y: 20, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power4.out" }, BLOCK_AT);
    tl.fromTo(restate, { opacity: 0, y: 24, scale: 0.985 },
      { opacity: 1, y: 0, scale: 1, duration: 0.40, ease: "power4.out" }, 4.05);

    /* ============ SCENE 5 · 5.16-9.00 · the dramatic comma. 3.84s of silence. ===========
       A decaying shock, then dead still. Finite, timeline-driven, seek-safe, and the
       envelope reaches exactly 0 at t=9.00. It runs on the block wrapper, which carries
       no other transform, so the quickSetters can never clobber a GSAP tween. */
    var blockEl = $("#f03-block");
    var jitX = gsap.quickSetter(blockEl, "x", "px");
    var jitY = gsap.quickSetter(blockEl, "y", "px");
    var JIT_T0 = 5.16;
    var JIT_DUR = DURATION - JIT_T0;   /* runs out exactly on the frame's last frame */
    var J = { t: 0 };

    tl.to(J, {
      t: JIT_DUR, duration: JIT_DUR, ease: "none",
      onUpdate: function () {
        var prog = J.t / JIT_DUR;
        var ramp = Math.min(1, J.t / 0.07);
        var u = Math.max(0, Math.min(1, (prog - 0.42) / 0.58));
        var env = ramp * Math.pow(1 - u, 1.6);
        var w = Math.PI * 2 * 9 * prog;
        jitX((Math.sin(w) * 2.6 + Math.sin(w * 2.3 + 0.9) * 1.0) * env);
        jitY((Math.cos(w * 1.6 + 0.5) * 1.8 + Math.sin(w * 3.1) * 0.6) * env);
      }
    }, JIT_T0);

    /* the closing hairline settles in with the hold */
    tl.fromTo($("#f03-hair-c"), { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, JIT_T0);
  })();
  </script>
