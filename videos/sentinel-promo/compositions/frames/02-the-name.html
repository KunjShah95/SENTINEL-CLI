      function hexToRgb(hex) {
        var h = hex.replace("#", "");

          parseInt(h.substring(0, 2), 16),
          parseInt(h.substring(2, 4), 16),
          parseInt(h.substring(4, 6), 16),

        var a = hexToRgb(fromHex);
        var b = hexToRgb(toHex);
        return function (p) {
          var r = Math.round(a[0] + (b[0] - a[0]) * p);
          var g = Math.round(a[1] + (b[1] - a[1]) * p);
          var bl = Math.round(a[2] + (b[2] - a[2]) * p);
          return "rgb(" + r + "," + g + "," + bl + ")";

      /* ================================================================== *
       * SCENE 1 (0.00 - 0.40s)  —  svg-path-draw
       * A single sage rule stub draws on above the optical centre. Thin, and
       * the only element in the frame. Dasharray/dashoffset come from the
       * MEASURED path length, never a guessed magic number.
       * ================================================================== */

      var stubPath = document.getElementById("f02-the-name-stub-path");
      var stubLen = stubPath.getTotalLength() * 1.05; // the rule's own over-estimate
      stubPath.style.strokeDasharray = String(stubLen);
      stubPath.style.strokeDashoffset = String(stubLen);

      tl.to(
        stubPath,
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        0.08 // SEG_1_START: a short lead-in so the viewer settles before motion
      );

      /* ================================================================== *
       * SCENE 2 (0.40 - 1.70s)  —  dynamic-content-sequencing
       * The wordmark "resolves". A CONTENT array of states is reduced ONCE
       * at build time into a flat TIMELINE of absolute {start, end} windows,
       * where each window's duration is content-derived. One linear driver
       * reverse-searches the flat array; the DOM is written only when the
       * visible state actually changes. No per-item hardcoded offsets.
       *
       * The render is a substring of ONE text node, so the display ramp's
       * -0.04em tracking and its kern pairs survive the build intact.
       * ================================================================== */

      var MARK = "sentinel";
      var MARK_T0 = 0.42; // the "Sentinel" cue

      // per-item pacing config (dynamic-content-sequencing tokens)
      var BASE_DURATION = 0.1;  // minimum per entry, regardless of length
      var SEC_PER_CHAR = 0.02;  // a 1-char entry still earns a little screen time
      var MARK_HOLD = 0.04;     // dwell before the next state

      var MARK_CONTENT = [];
      for (var mi = 0; mi < MARK.length; mi++) {
        MARK_CONTENT.push({ key: "m" + mi, body: MARK.charAt(mi), hold: MARK_HOLD });
      }

      // Pre-compute the absolute TIMELINE ONCE — never in onUpdate.
      var markCumulative = MARK_T0;
      var MARK_TIMELINE = MARK_CONTENT.map(function (entry) {
        var dur = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        var start = markCumulative;
        markCumulative += dur;
        return { key: entry.key, body: entry.body, start: start, end: start + dur };
      });
      var MARK_SPAN = markCumulative - MARK_T0;

      var markTextEl = document.getElementById("f02-the-name-mark-text");
      var markBodyEl = document.getElementById("f02-the-name-mark-body");
      var markEl = document.getElementById("f02-the-name-mark");
      var lastMarkState = null;

      function renderMark(time) {
        var shown = 0;
        // reverse search over the pre-computed flat TIMELINE
        for (var i = MARK_TIMELINE.length - 1; i >= 0; i--) {
          if (time >= MARK_TIMELINE[i].start) {
            shown = i + 1;
            break;
          }
          if (i === 0) shown = 0; // before the first entry's window
        }
        var state = MARK.substring(0, shown);
        // swap only on a transition — per-frame textContent writes flicker in render
        if (state !== lastMarkState) {
          markTextEl.textContent = state;
          lastMarkState = state;
        }
      }
      renderMark(0);

      var markDriver = { t: 0 };
      tl.to(
        markDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            renderMark(markDriver.t);
          },
        },
        0
      );

      // The entry settle: the word as a whole brightens and rises as it resolves
      // (the blueprint's "subtle scale-up settle", run as one restrained move).
      tl.fromTo(
        markBodyEl,
        { opacity: 0.35, y: 12 },
        { opacity: 1, y: 0, duration: MARK_SPAN, ease: "power2.out", immediateRender: true },
        MARK_T0
      );

      /* ================================================================== *
       * SCENE 3 (1.70 - 2.94s)  —  discrete-text-sequence
       * The thesis arrives as a HARD-CUT / flash word-swap. Each word appears
       * at a frame threshold with no tween between states (a discrete jump
       * that animates turns into a smear), then flashes from paper-white down
       * to its resting tone over 0.2s. A block cursor sits at the growing
       * end of the line, blinking on a deterministic sin square wave.
       * ================================================================== */

      // Sparse array of { t } thresholds — monotonically increasing.
      // Shape: keystrokes clustered on the beat, one small pause at the claim.
      var WORD_STATES = [
        { t: 1.72, el: "f02-the-name-w0" },
        { t: 1.88, el: "f02-the-name-w1" },
        { t: 2.04, el: "f02-the-name-w2" },
        { t: 2.18, el: "f02-the-name-w3" },
        { t: 2.36, el: "f02-the-name-w4" },
        { t: 2.5, el: "f02-the-name-w5" },
        { t: 2.66, el: "f02-the-name-w6" },
      ];
      var FLASH_DUR = 0.2; // flash decay — the "flash" of the word-swap
      var FLASH_FROM = "#FFFFFF";

      var thesisWrapEl = document.getElementById("f02-the-name-thesis-wrap");
      var cursorEl = document.getElementById("f02-the-name-cursor");
      var wordEls = WORD_STATES.map(function (s) {
        return document.getElementById(s.el);
      });

      // The cursor rides the growing end of the line: it is re-inserted ahead of
      // the next unrevealed word on every transition (guarded, so it is a single
      // node move per state change, not a per-frame DOM write).
      var lastShown = -1;
      function renderThesis(time) {
        var shown = 0;
        for (var i = 0; i < WORD_STATES.length; i++) {
          if (time >= WORD_STATES[i].t) shown = i + 1;
        }
        if (shown === lastShown) return;
        lastShown = shown;
        thesisWrapEl.insertBefore(cursorEl, wordEls[shown] || null);
      }
      renderThesis(0);

      var thesisDriver = { t: 0 };
      tl.to(
        thesisDriver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            renderThesis(thesisDriver.t);
          },
        },
        0
      );

      var REST_GREY = "#959C94";
      var REST_INK = "#ECEEE9";
      var CLAIM_FROM = 4; // word index where "shows its work" begins

      for (var w = 0; w < wordEls.length; w++) {
        var el = wordEls[w];
        var rest = w >= CLAIM_FROM ? REST_INK : REST_GREY;

        // INSTANT appearance — a zero-duration set, not a fade.
        tl.set(el, { opacity: 1 }, WORD_STATES[w].t);

        // The flash: paper-white settling to the resting tone.
        tl.fromTo(
          el,
          { color: FLASH_FROM },
          { color: rest, duration: FLASH_DUR, ease: "power1.out", immediateRender: true },
          WORD_STATES[w].t
        );
      }

      // Cursor blink — deterministic sin square wave driven by the timeline clock
      // (never a CSS animation: CSS runs on the browser's render clock, not the
      // seek clock). Ends on sin = +1, so it locks SOLID for the held beat.
      var BLINK_T0 = 1.72;
      var BLINK_T1 = 2.94;
      var BLINK_CYCLES = 2.25; // sin(2pi * 2.25) === sin(pi/2) === 1 at the end
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: BLINK_T1 - BLINK_T0,
          ease: "none",
          onUpdate: function () {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        BLINK_T0
      );

      /* ================================================================== *
       * SCENE 4 (2.94 - 6.00s)  —  sine-wave-loop, LOW end
       * 3.1s of held silence on the resolved lockup. The promise sits still
       * and is trusted. The only live element is a bounded jitter on the
       * wordmark — the doctrine's sanctioned post-settle move, not a breath.
       *
       * Idle is >30% of the composition, so amplitudes are halved, the period
       * is stretched to ~3s, and a settle-and-fade tail ramps the amplitude to
       * zero over the last 22% so the outgoing visual is static when the root
       * transition begins.
       * ================================================================== */

      var IDLE_START = 2.94;
      var IDLE_DUR = DURATION - IDLE_START; // 3.06s
      var IDLE_CYCLES = 1; // period = 3.06s
      var Y_AMP_PX = 1.4; // halved from the 2-3px default (long idle)
      var SCALE_AMP = 0.005; // halved from the 0.008-0.015 default
      var FADE_FRAC = 0.22; // settle-and-fade tail

      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * IDLE_CYCLES,
          duration: IDLE_DUR,
          ease: "none", // sine provides the easing
          onUpdate: function () {
            var t = phase.p / (Math.PI * 2 * IDLE_CYCLES); // 0 -> 1 across the idle
            var env = t < 1 - FADE_FRAC ? 1 : (1 - t) / FADE_FRAC;
            var s = Math.sin(phase.p);
            // sin(0) = 0 at IDLE_START, so there is no jump off the entry's rest
            markEl.style.transform =
              "translateY(" + s * Y_AMP_PX * env + "px) scale(" + (1 + s * SCALE_AMP * env) + ")";
          },
        },
        IDLE_START
      );
    })();
  </script>
</template>
