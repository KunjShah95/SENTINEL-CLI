  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function () {
    /* the frame root carries no id of its own — resolve it by its composition id */
    var root = document.querySelector('[data-composition-id="08-run-it"]');
    if (!root || typeof gsap === "undefined") return;

    var DURATION = 10;
    var WAIT_AT = 4.8;      /* the product's first prompt appears */
    var BLINK_CYCLES = 13;  /* whole number, period 0.77s */

    /* --- the real install block, verbatim, each line cued on its own landing --- */
    var LINES = [
      { t0: 0.30, t1: 0.95, text: "git clone https://github.com/KunjShah95/SENTINEL-CLI.git" },
      { t0: 1.04, t1: 1.34, text: "cd SENTINEL-CLI" },
      { t0: 1.44, t1: 1.71, text: "npm install" },
      { t0: 1.81, t1: 2.06, text: "npm link" },
      { t0: 2.62, t1: 3.42, text: "export GROQ_API_KEY=gsk_…" },
      { t0: 4.18, t1: 4.62, text: "sentinel" }
    ];

    var textEls = [], caretEls = [], promptEls = [];
    for (var k = 0; k < LINES.length; k++) {
      textEls.push(root.querySelector("#f08-t" + k));
      caretEls.push(root.querySelector("#f08-c" + k));
      promptEls.push(root.querySelector("#f08-p" + k));
    }
    var waitCaret = root.querySelector("#f08-c6");
    var waitPrompt = root.querySelector("#f08-p6");

    var elTermStage = root.querySelector(".f08-term-stage");
    var elPanel  = root.querySelector("#f08-panel");
    var elKicker = root.querySelector("#f08-kicker");
    var elWait   = root.querySelector("#f08-wait");
    var elMark   = root.querySelector("#f08-mark");
    var elHair   = root.querySelector("#f08-hair");
    var elUrl    = root.querySelector("#f08-url");
    var elBlack  = root.querySelector("#f08-black");

    /* deterministic square-wave blink — a pure function of timeline time */
    function blinkOn(t) {
      return Math.sin((t / DURATION) * Math.PI * 2 * BLINK_CYCLES) > 0;
    }

    /* discrete-text-sequence, generalised to the block: reverse-search each frame,
       reverse-seek-safe, no mutable tracker, no CSS transition on the text. */
    var driver = { t: 0 };
    function renderBlock(t) {
      for (var i = LINES.length - 1; i >= 0; i--) {
        var L = LINES[i];
        var n = 0;
        var active = false;
        if (t >= L.t0) {
          if (t >= L.t1) {
            n = L.text.length;
          } else {
            n = Math.floor(((t - L.t0) / (L.t1 - L.t0)) * L.text.length);
            active = true;
          }
        }
        textEls[i].textContent = L.text.substring(0, n);
        caretEls[i].style.opacity = active ? "1" : "0";
      }
      waitCaret.style.opacity = t >= WAIT_AT && blinkOn(t) ? "1" : "0";
    }
    renderBlock(0);

    window.__timelines = window.__timelines || {};
    var tl = (window.__timelines["08-run-it"] = gsap.timeline({ paused: true }));

    /* --- Scene 1 · the terminal arrives: the blueprint's chip-stretch, anchored left --- */
    tl.fromTo(
      elPanel,
      { scaleX: 0.86, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    /* --- Scene 2 · the four commands, one landing each --- */
    tl.fromTo(
      elKicker,
      { opacity: 0, y: -8 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      LINES[0].t0
    );
    for (var i2 = 0; i2 < LINES.length; i2++) {
      tl.fromTo(
        promptEls[i2],
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "none" },
        LINES[i2].t0
      );
    }

    /* --- Scene 3 · the product starts; a first prompt waits at the caret --- */
    tl.fromTo(
      elWait,
      { opacity: 0, y: -8 },
      { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
      WAIT_AT
    );
    tl.fromTo(
      waitPrompt,
      { opacity: 0 },
      { opacity: 1, duration: 0.12, ease: "none" },
      WAIT_AT
    );

    /* the typing driver — one global, always-on tween, so every seek repaints */
    tl.to(
      driver,
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          renderBlock(driver.t);
        }
      },
      0
    );

    /* --- Scene 4 · the terminal demotes, the typeset wordmark resolves --- */
    tl.to(
      elTermStage,
      { opacity: 0, y: -18, scale: 0.985, duration: 0.36, ease: "power2.in" },
      5.2
    );
    tl.fromTo(
      elMark,
      { opacity: 0, scale: 0.94, y: 26 },
      { opacity: 1, scale: 1, y: 0, duration: 0.86, ease: "power3.out" },
      5.46
    );
    tl.fromTo(
      elHair,
      { opacity: 0, scaleX: 0 },
      { opacity: 1, scaleX: 1, duration: 0.44, ease: "power3.out" },
      6.62
    );
    tl.fromTo(
      elUrl,
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.56, ease: "power2.out" },
      7.16
    );

    /* --- Scene 5 · hold on the chime, then cut to black (this frame's real exit) --- */
    tl.fromTo(
      elBlack,
      { opacity: 0 },
      { opacity: 1, duration: 0.28, ease: "power2.in" },
      9.62
    );
  })();
  </script>
