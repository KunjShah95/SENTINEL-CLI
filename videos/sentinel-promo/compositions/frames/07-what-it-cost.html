<script>
(function () {
  var R = "07-what-it-cost";
  var $ = function (id) { return document.getElementById(R + "-" + id); };

  var camera   = $("camera");
  var bloom    = $("bloom");
  var chrome   = $("chrome");
  var stub     = $("stub");
  var counter  = $("counter");
  var label    = $("label");
  var rows     = [].slice.call(document.querySelectorAll(".w07-row"));
  var oldCosts = [].slice.call(document.querySelectorAll(".w07-cost-old"));
  var newCosts = [].slice.call(document.querySelectorAll(".w07-cost-new"));
  var cards    = [].slice.call(document.querySelectorAll(".w07-card"));

  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines[R] = tl;

  var PEAK = 63;            // $0.63 — the climb, in cents
  var START_SCALE = 0.5;    // START_SIZE / END_SIZE

  function writeValue(v) {
    counter.textContent = "$" + v.toFixed(2);
  }

  /* ── macro camera: one continuous push that peaks and is then still ─────── */
  tl.fromTo(camera, { scale: 1 }, { scale: 1.03, duration: 6.4, ease: "power2.out" }, 0);

  /* ── chrome + ornament ──────────────────────────────────────────────────── */
  tl.fromTo(chrome, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.18);
  tl.fromTo(stub,   { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.24);

  /* ── Scene 2 · the climb begins (0.3s, on "Every turn prints what it cost") */
  tl.fromTo(bloom,   { opacity: 0 }, { opacity: 0.9, duration: 0.9, ease: "power2.out" }, 0.28);
  tl.fromTo(counter, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0.28);
  tl.fromTo(counter, { scale: START_SCALE }, { scale: 1, duration: 3.45, ease: "power3.out" }, 0.30);

  var climb = { v: 0 };
  tl.to(climb, {
    v: PEAK,
    duration: 1.60,
    ease: "power2.in",
    onUpdate: function () { writeValue(climb.v); }
  }, 0.30);

  tl.fromTo(label, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.75);

  /* per-turn rows land one per beat */
  var rowAt = [0.55, 0.95, 1.35];
  for (var i = 0; i < rows.length; i++) {
    tl.fromTo(rows[i], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, rowAt[i]);
  }

  /* ── Scene 3 · decelerate onto $0.00 (1.9s, on "The default costs nothing") */
  var settle = { v: PEAK };
  tl.to(settle, {
    v: 0,
    duration: 1.85,
    ease: "expo.out",
    onUpdate: function () { writeValue(settle.v); }
  }, 1.90);

  /* every printed cost resolves to $0.00 while the counter decelerates */
  for (var j = 0; j < oldCosts.length; j++) {
    tl.to(oldCosts[j], { opacity: 0, duration: 0.32, ease: "power2.inOut" }, 2.72);
    tl.to(newCosts[j], { opacity: 1, duration: 0.36, ease: "power2.out" }, 2.86);
  }

  /* soft pop on the landing */
  tl.fromTo(counter, { scale: 1.045 }, { scale: 1, duration: 0.55, ease: "back.out(2.2)", immediateRender: false }, 3.75);
  tl.fromTo(bloom,   { scale: 0.88 },    { scale: 1, duration: 0.70, ease: "back.out(2.4)", immediateRender: false }, 3.75);

  /* ── Scene 4 · the stat grid resolves in the silence (3.75–6.5s) ────────── */
  var cardAt = [3.95, 4.40, 4.85, 5.55];
  for (var k = 0; k < cards.length; k++) {
    tl.fromTo(cards[k], { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, cardAt[k]);
  }

  /* ── Scene 5 · hold (6.5–10.0s): everything still, nothing breathing ────── */
  tl.set(counter, { opacity: 1 }, 10);
})();
</script>
